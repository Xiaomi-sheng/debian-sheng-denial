# ============================================================================
# 🐧 Build RootFS for Xiaomi Pad 6s Pro (Sheng)
# ============================================================================

name: 根文件系统构建核心 / RootFS build core

on:
  workflow_call:
    inputs:
      distro:
        description: "发行版 / Distribution (Debian or Ubuntu)"
        type: string
        required: true

      version:
        description: "版本号 / Version (Debian 13/14, Ubuntu 24.04+)"
        type: string
        required: true

      desktop:
        description: "预装桌面 / Desktop environment"
        type: string
        default: "KDE 桌面 / KDE Desktop"
        required: false
      plasma_mobile:
        description: "KDE 用 Plasma Mobile / Plasma Mobile"
        type: boolean
        default: false
        required: false
      autologin:
        description: "自动登录 / Autologin"
        type: boolean
        default: true
        required: false
      username:
        description: "用户名 / Username"
        type: string
        default: "username"
        required: false
      password:
        description: "密码（留空用 secret，再默认 password）/ Password (empty = secret, then default)"
        type: string
        default: ""
        required: false
      hostname:
        description: "主机名 / Hostname"
        type: string
        default: "xiaomi-sheng"
        required: false
      language:
        description: "系统语言 / System language"
        type: string
        default: "None (C.UTF-8)"
        required: false
      boot_mode:
        description: "启动方式 / Boot mode: single=userdata, dual=linux, custom=指定分区"
        type: string
        default: "双系统 linux / Dual linux"
        required: false
      quiet_boot:
        description: "安静启动 / Quiet boot (Plymouth)"
        type: boolean
        default: true
        required: false
      custom_partition:
        description: "自定义分区名 / Custom partition name"
        type: string
        default: ""
        required: false
      kernel_source:
        description: "内核来源 / Kernel source: prebuilt or build from source"
        type: string
        default: "预构建内核 / Prebuilt kernel"
        required: false
      kernel_repo:
        description: "内核仓库 / Kernel repository URL"
        type: string
        default: "https://github.com/ianchb/sm8550-mainline"
        required: false
      kernel_branch:
        description: "内核分支 / Kernel branch"
        type: string
        default: "sheng-7.3.4"
        required: false
      kernel_config:
        description: "内核配置 / Kernel config file"
        type: string
        default: "sm8550.config"
        required: false
      firmware_repo:
        description: "固件仓库 / Firmware repository URL"
        type: string
        default: "https://github.com/ianchb/sheng-firmware"
        required: false
      firmware_branch:
        description: "固件分支 / Firmware branch"
        type: string
        default: "master"
        required: false
    secrets:
      ROOTFS_PASSWORD:
        required: false

# ============================================================================
# Build Jobs — each produces one .deb, uploaded as an artifact
# ============================================================================

jobs:
  # ==========================================================================
  # Kernel (conditional on custom_build)
  # ==========================================================================
  build-kernel:
    name: "Build Kernel"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "跳过（预构建内核） / Skip (Prebuilt Kernel)"
        if: ${{ inputs.kernel_source != '自行编译内核 / Build from source' }}
        run: echo "✓ Using prebuilt kernel, build skipped"

      - name: "检出仓库 / Checkout Repo"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        uses: actions/checkout@v7

      - name: "安装构建工具 / Install Build Tools"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev bc \
            ccache clang llvm lld
          mkdir -p /home/runner/.ccache
          ccache --set-config=max_size=10G
          ccache --set-config=cache_dir=/home/runner/.ccache
          ccache --set-config=sloppiness=file_macro,locale,time_macros
          echo "✓ 构建工具已安装 / Build tools installed"

      - name: "恢复 ccache / Restore ccache"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        uses: actions/cache@v6
        with:
          path: /home/runner/.ccache
          key: ccache-kernel-${{ inputs.kernel_branch }}-${{ inputs.kernel_config }}-${{ hashFiles(inputs.kernel_config) }}
          restore-keys: |
            ccache-kernel-${{ inputs.kernel_branch }}-${{ inputs.kernel_config }}-
            ccache-kernel-${{ inputs.kernel_branch }}-
            ccache-kernel-

      - name: "克隆内核仓库 / Clone Kernel Repo"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        run: |
          git clone "${{ inputs.kernel_repo }}" \
            --branch "${{ inputs.kernel_branch }}" \
            --depth 1 \
            linux
          echo "✓ 内核仓库已克隆 / Kernel repo cloned"

      - name: "编译内核 / Build Kernel"
        id: build
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        run: |
          export CCACHE_DIR=/home/runner/.ccache
          export PATH="/usr/lib/ccache:$PATH"
          export CC="ccache clang"
          export CXX="ccache clang++"
          export AR="llvm-ar"
          export NM="llvm-nm"
          export OBJCOPY="llvm-objcopy"
          export OBJDUMP="llvm-objdump"
          export READELF="llvm-readelf"
          export STRIP="llvm-strip"

          cp "${{ github.workspace }}/${{ inputs.kernel_config }}" linux/.config
          cd linux

          make -j$(nproc) ARCH=arm64 LLVM=1

          KVER="$(make kernelrelease -s)"
          echo "kernel_version=$KVER" >> $GITHUB_OUTPUT
          echo "  内核版本：$KVER /   Kernel version: $KVER"

          make -j$(nproc) ARCH=arm64 LLVM=1 \
            INSTALL_MOD_PATH="${{ github.workspace }}/linux-xiaomi-sheng" \
            modules_install
          rm -rf "${{ github.workspace }}/linux-xiaomi-sheng/lib/modules/"*"/build" || true

          mkdir -p "${{ github.workspace }}/linux-xiaomi-sheng/boot"
          install -Dm644 arch/arm64/boot/Image.gz \
            "${{ github.workspace }}/linux-xiaomi-sheng/boot/Image.gz"
          install -Dm644 arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            "${{ github.workspace }}/linux-xiaomi-sheng/boot/sm8550-xiaomi-sheng.dtb"
          install -Dm644 .config \
            "${{ github.workspace }}/linux-xiaomi-sheng/boot/config-${KVER}"
          install -Dm644 System.map \
            "${{ github.workspace }}/linux-xiaomi-sheng/boot/System.map-${KVER}"

          cat arch/arm64/boot/Image.gz \
              arch/arm64/boot/dts/qcom/sm8550-xiaomi-sheng.dtb \
            > "${{ github.workspace }}/Image.gz-dtb_sheng"

          cd "${{ github.workspace }}"
          ccache --show-stats --verbose | grep -E "(hit rate|cache hit|cache miss|max size)" || true
          echo "✓ 内核编译完成 / Kernel build complete"

      - name: "打包内核 / Package Kernel"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        run: |
          KVER="${{ steps.build.outputs.kernel_version }}"
          mkdir -p linux-xiaomi-sheng/DEBIAN
          cat > linux-xiaomi-sheng/DEBIAN/control << CTRL
          Package: linux-xiaomi-sheng
          Version: ${KVER}
          Architecture: arm64
          Maintainer: map220v
          Section: kernel
          Description: Kernel and Modules for Xiaomi Pad 6s Pro
          CTRL
          dpkg-deb --build --root-owner-group linux-xiaomi-sheng
          echo "✓ 内核安装包已生成 / linux-xiaomi-sheng.deb packaged"

      - name: "上传内核安装包 / Upload Kernel Package"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        uses: actions/upload-artifact@v7
        with:
          name: kernel-custom-deb
          path: linux-xiaomi-sheng.deb
          retention-days: 3
          if-no-files-found: error

      - name: "上传内核镜像 / Upload Kernel Image"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        uses: actions/upload-artifact@v7
        with:
          name: kernel-custom-image
          path: Image.gz-dtb_sheng
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # fastrpc — Qualcomm FastRPC userspace + adsprpcd-sensorspd.service
  # ==========================================================================
  build-fastrpc:
    name: "Build fastrpc"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "检出仓库 / Checkout Repo"
        uses: actions/checkout@v7

      - name: "安装构建工具 / Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool pkg-config \
            git wget unzip dpkg-dev libyaml-dev linux-libc-dev
          echo "✓ 构建工具已安装 / Build tools installed"

      - name: "下载源码 / Download Source"
        run: |
          wget -q https://github.com/qualcomm/fastrpc/archive/refs/tags/v1.0.2.zip
          unzip -q v1.0.2.zip
          echo "✓ 源码已下载 / Source downloaded"

      - name: "编译 fastrpc / Build fastrpc"
        run: |
          cd fastrpc-1.0.2
          autoreconf -is
          ./configure --prefix=/usr
          make -j$(nproc)
          mkdir -p stage
          make DESTDIR=$PWD/stage install
          echo "✓ fastrpc 已编译 / fastrpc built"

      - name: "添加 systemd 服务 / Add systemd Service"
        run: |
          mkdir -p fastrpc-1.0.2/stage/usr/lib/systemd/system
          cp patches/adsprpcd-sensorspd.service fastrpc-1.0.2/stage/usr/lib/systemd/system/
          echo "✓ systemd 服务已添加 / systemd service added"

      - name: "打包 fastrpc / Package fastrpc"
        run: |
          mkdir -p deb/DEBIAN
          cp -r fastrpc-1.0.2/stage/usr deb/

          cat > deb/DEBIAN/control << EOF
          Package: fastrpc
          Version: 1.0.2-1
          Section: libs
          Priority: optional
          Architecture: arm64
          Maintainer: Fauzan Amir Al Ghiffary <alghiffaryfa19@gmail.com>
          Depends: libyaml-0-2, systemd
          Description: Qualcomm FastRPC userspace library
           FastRPC implementation for Qualcomm DSP communication.
          EOF

          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;
          chmod 755 deb/usr/bin/adsprpcd
          dpkg-deb --build deb
          mv deb.deb fastrpc_1.0.2-1_arm64.deb
          echo "✓ fastrpc 已打包 / fastrpc packaged"

      - name: "上传 fastrpc / Upload fastrpc"
        uses: actions/upload-artifact@v7
        with:
          name: fastrpc-deb
          path: fastrpc_*.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # libssc — Qualcomm Sensor Core userspace library
  # ==========================================================================
  build-libssc:
    name: "Build libssc"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "检出仓库 / Checkout Repo"
        uses: actions/checkout@v7

      - name: "安装构建工具 / Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build git pkg-config python3-pip \
            libglib2.0-dev libprotobuf-c-dev libqmi-glib-dev libmbim-glib-dev \
            linux-libc-dev protobuf-compiler protobuf-c-compiler
          pip3 install --upgrade meson
          echo "✓ 构建工具已安装 / Build tools installed"

      - name: "克隆源码 / Clone Source"
        run: |
          set -u
          ok=0
          for attempt in 1 2 3; do
            rm -rf source
            if git clone --depth 1 https://codeberg.org/DylanVanAssche/libssc.git source; then
              ok=1
              break
            fi
            echo "::warning::libssc 克隆失败（codeberg，第 ${attempt} 次）/ libssc clone attempt ${attempt} failed"
            sleep 15
          done
          if [[ "$ok" != "1" ]]; then
            # codeberg 出过 503 导致整个构建失败；Debian 源码包有同一个 0.3.0 版本，
            # 直接用它兜底，补丁同样能打上。
            echo "::warning::codeberg 不可用，改用 Debian 源码包 libssc 0.3.0 / codeberg unavailable, using the Debian 0.3.0 source tarball"
            curl -fsSL --retry 3 -o /tmp/libssc.tar.gz \
              https://deb.debian.org/debian/pool/main/libs/libssc/libssc_0.3.0.orig.tar.gz
            mkdir -p source
            tar -xzf /tmp/libssc.tar.gz -C source --strip-components=1
          fi
          echo "✓ 源码已克隆 / Source cloned"

      - name: "应用补丁 / Apply Patch"
        run: |
          cd source
          cp "${{ github.workspace }}/patches/wait_for_qmi_service.patch" .
          patch -Np1 < wait_for_qmi_service.patch || true
          echo "✓ 补丁已应用 / Patch applied"

      - name: "编译 libssc / Build libssc"
        run: |
          cd source
          meson setup build --prefix=/usr
          meson compile -C build
          DESTDIR=$PWD/stage meson install -C build
          echo "✓ libssc 已编译 / libssc built"

      - name: "打包 libssc / Package libssc"
        run: |
          mkdir -p deb/DEBIAN deb/usr
          cp -r source/stage/usr/* deb/usr/

          cat > deb/DEBIAN/control << EOF
          Package: libssc
          Version: 0.3.0-1
          Section: libs
          Priority: optional
          Architecture: arm64
          Maintainer: Fauzan Amir Al Ghiffary <alghiffaryfa19@gmail.com>
          Depends: libglib2.0-0, libprotobuf-c1, libqmi-glib5
          Description: Library to expose Qualcomm Sensor Core sensors
           libssc userspace library for Qualcomm SSC.
          EOF

          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;
          chmod 755 deb/usr/bin/ssccli
          dpkg-deb --build deb
          mv deb.deb libssc_0.3.0-1_arm64.deb
          echo "✓ libssc 已打包 / libssc packaged"

      - name: "上传 libssc / Upload libssc"
        uses: actions/upload-artifact@v7
        with:
          name: libssc-deb
          path: libssc_*.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # iio-sensor-proxy — patched with Qualcomm SSC support (needs libssc)
  # ==========================================================================
  build-iio-sensor-proxy:
    name: "Build iio-sensor-proxy"
    runs-on: ubuntu-24.04-arm
    needs: [build-libssc]

    steps:
      - name: "安装构建工具 / Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential ninja-build pkg-config git wget dpkg-dev \
            python3-pip libglib2.0-dev libgudev-1.0-dev \
            libpolkit-gobject-1-dev libsystemd-dev libdbus-1-dev \
            systemd libqmi-glib-dev libmbim-glib-dev \
            linux-libc-dev protobuf-compiler protobuf-c-compiler
          pip3 install --upgrade meson
          echo "✓ 构建工具已安装 / Build tools installed"

      - name: "下载 libssc / Download libssc"
        uses: actions/download-artifact@v8
        with:
          name: libssc-deb

      - name: "安装 libssc / Install libssc"
        run: |
          sudo dpkg -i libssc_*.deb
          sudo ldconfig
          echo "✓ libssc 已安装 / libssc installed"

      - name: "下载源码 / Download Source"
        run: |
          wget -q https://gitlab.freedesktop.org/hadess/iio-sensor-proxy/-/archive/3.9/iio-sensor-proxy-3.9.tar.gz
          tar -xf iio-sensor-proxy-3.9.tar.gz
          echo "✓ 源码已下载 / Source downloaded"

      - name: "编译 iio-sensor-proxy / Build iio-sensor-proxy"
        run: |
          cd iio-sensor-proxy-3.9
          meson setup output \
            --prefix=/usr \
            -Db_lto=true \
            -Dssc-support=enabled \
            -Dsystemdsystemunitdir=/usr/lib/systemd/system
          meson compile -C output
          DESTDIR=$PWD/stage meson install --no-rebuild -C output
          echo "✓ iio-sensor-proxy 已编译 / iio-sensor-proxy built"

      - name: "打包 iio-sensor-proxy / Package iio-sensor-proxy"
        run: |
          mkdir -p deb/DEBIAN
          cp -r iio-sensor-proxy-3.9/stage/usr deb/

          cat > deb/DEBIAN/control << EOF
          Package: iio-sensor-proxy
          Version: 99993.9-6
          Section: misc
          Priority: optional
          Architecture: arm64
          Maintainer: Dylan Van Assche <me@dylanvanassche.be>
          Depends: dbus, libglib2.0-0, libgudev-1.0-0, libpolkit-gobject-1-0
          Description: IIO sensors to D-Bus proxy (SSC patched)
           iio-sensor-proxy with Qualcomm SSC support patches.
          EOF

          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;
          chmod 755 deb/usr/bin/monitor-sensor
          chmod 755 deb/usr/libexec/iio-sensor-proxy
          dpkg-deb --build deb
          mv deb.deb iio-sensor-proxy_99993.9-6_arm64.deb
          echo "✓ iio-sensor-proxy 已打包 / iio-sensor-proxy packaged"

      - name: "上传 iio-sensor-proxy / Upload iio-sensor-proxy"
        uses: actions/upload-artifact@v7
        with:
          name: iio-sensor-proxy-deb
          path: iio-sensor-proxy_*.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # sheng-sensors — proprietary sensor configuration files
  # ==========================================================================
  build-sheng-sensors:
    name: "Build sheng-sensors"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "检出仓库 / Checkout Repo"
        uses: actions/checkout@v7

      - name: "安装构建工具 / Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          echo "✓ 构建工具已安装 / Build tools installed"

      - name: "打包 sheng-sensors / Package sheng-sensors"
        run: |
          mkdir -p deb/DEBIAN
          cp -r sheng-sensors-files/usr deb/

          cat > deb/DEBIAN/control << EOF
          Package: sheng-sensors
          Version: 20240917-1
          Section: misc
          Priority: optional
          Architecture: arm64
          Maintainer: Fauzan Amir Al Ghiffary <alghiffaryfa19@gmail.com>
          Description: Sensor files for Xiaomi Mi Pad 6s Pro
           Proprietary sensor configuration files.
          EOF

          find deb -type d -exec chmod 755 {} \;
          find deb -type f -exec chmod 644 {} \;

          cat > deb/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          set -e
          if command -v udevadm >/dev/null 2>&1; then
            udevadm control --reload || true
            if [ -e /sys/devices/virtual/misc/fastrpc-adsp ]; then
              udevadm trigger /sys/devices/virtual/misc/fastrpc-adsp || true
            fi
          fi
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
            if [ -d /run/systemd/system ]; then
              systemctl try-restart iio-sensor-proxy.service || true
            fi
          fi
          exit 0
          EOF
          chmod 755 deb/DEBIAN/postinst

          dpkg-deb --build deb
          mv deb.deb sheng-sensors_20240917-1_arm64.deb
          echo "✓ sheng-sensors 已打包 / sheng-sensors packaged"

      - name: "上传 sheng-sensors / Upload sheng-sensors"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-sensors-deb
          path: sheng-sensors_*.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # sheng-devauth — keyboard authentication daemon
  # ==========================================================================
  build-sheng-devauth:
    name: "Build sheng-devauth"
    runs-on: ubuntu-24.04-arm

    steps:
      - name: "检出仓库 / Checkout Repo"
        uses: actions/checkout@v7

      - name: "安装构建工具 / Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev git
          echo "✓ 构建工具已安装 / Build tools installed"

      - name: "克隆源码 / Clone Source"
        run: |
          git clone https://github.com/ianchb/sheng_devauth.git source
          echo "✓ 源码已克隆 / Source cloned"

      - name: "编译二进制 / Build Binary"
        run: |
          cd source
          make
          echo "✓ 二进制已编译 / Binary built"

      - name: "打包 sheng-devauth / Package sheng-devauth"
        run: |
          mkdir -p sheng-devauth/usr/bin
          chmod 0755 source/xiaomi_devauth
          cp source/xiaomi_devauth sheng-devauth/usr/bin/

          cat > sheng-devauth/DEBIAN/postinst << 'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
            systemctl enable sheng-devauth.service || true
            systemctl start sheng-devauth.service || true
          fi
          exit 0
          EOF
          chmod 0755 sheng-devauth/DEBIAN/postinst

          cat > sheng-devauth/DEBIAN/prerm << 'EOF'
          #!/bin/sh
          set -e
          if command -v systemctl >/dev/null 2>&1; then
            systemctl stop sheng-devauth.service || true
            systemctl disable sheng-devauth.service || true
          fi
          exit 0
          EOF
          chmod 0755 sheng-devauth/DEBIAN/prerm

          dpkg-deb --build --root-owner-group sheng-devauth
          echo "✓ sheng-devauth 已打包 / sheng-devauth packaged"

      - name: "上传 sheng-devauth / Upload sheng-devauth"
        uses: actions/upload-artifact@v7
        with:
          name: sheng-devauth-deb
          path: sheng-devauth.deb
          retention-days: 3
          if-no-files-found: error

  # ==========================================================================
  # RootFS Assembly — collects every .deb, builds the image
  # ==========================================================================
  build-rootfs:
    name: "Build RootFS"
    runs-on: ubuntu-24.04-arm
    needs:
      - build-kernel
      - build-fastrpc
      - build-libssc
      - build-iio-sensor-proxy
      - build-sheng-sensors
      - build-sheng-devauth
    permissions:
      contents: read
      packages: read

    env:
      ROOTFS_MOUNT: /mnt/rootfs
      IMAGE_SIZE: 10G

    steps:
      # ----------------------------------------------------------------
      # Checkout & Validate
      # ----------------------------------------------------------------

      - name: "检出仓库 / Checkout Repo"
        uses: actions/checkout@v7

      - name: "校验参数 / Verify Arguments"
        env:
          INPUT_PASSWORD: ${{ inputs.password }}
          ROOTFS_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: |
          if [[ -z "$INPUT_PASSWORD" && -z "$ROOTFS_PASSWORD" ]]; then
            echo "::warning::密码输入与 ROOTFS_PASSWORD secret 都为空；镜像将使用默认密码 password。 / Neither the password input nor ROOTFS_PASSWORD is set; the image will use the default password 'password'."
          elif [[ -n "$INPUT_PASSWORD" ]]; then
            echo "::warning::正在使用工作流输入的密码；它会出现在本次运行的元数据里。公开仓库建议改用 ROOTFS_PASSWORD secret。 / Using the workflow input password; it appears in this run's metadata. Prefer the ROOTFS_PASSWORD secret on public repositories."
          fi
          if [[ "${{ inputs.boot_mode }}" == "自定义分区 / Custom partition" ]]; then
            if [[ "${{ inputs.kernel_source }}" != "自行编译内核 / Build from source" ]]; then
              echo "错误：自定义分区必须配合「自行编译内核」 / Error: Custom partition requires custom_build kernel"
              exit 1
            fi
            if [[ -z "${{ inputs.custom_partition }}" ]]; then
              echo "错误：启动方式选「自定义分区」时必须填写 custom_partition / Error: custom_partition is required when boot_mode=custom"
              exit 1
            fi
          fi
          echo "✓ 参数校验通过 / Arguments verified"

      - name: "解析发行版 / Resolve Distribution"
        id: os
        run: |
          if [[ "${{ inputs.distro }}" == "Ubuntu" ]]; then
            # Menu shows the release number; the archive only knows codenames.
            case "${{ inputs.version }}" in
              '24.04') SUITE=noble ;;
              '24.10') SUITE=oracular ;;
              '25.04') SUITE=plucky ;;
              '25.10') SUITE=questing ;;
              '26.04') SUITE=resolute ;;
              *)
                echo "错误：不支持的 Ubuntu 版本 ${{ inputs.version }} / Error: unsupported Ubuntu version '${{ inputs.version }}'"
                exit 1
                ;;
            esac
            echo "suite=$SUITE" >> $GITHUB_OUTPUT
            echo "mirror=http://ports.ubuntu.com/ubuntu-ports/" >> $GITHUB_OUTPUT
            echo "components=main,universe,restricted,multiverse" >> $GITHUB_OUTPUT
            echo "keyring=/usr/share/keyrings/ubuntu-archive-keyring.gpg" >> $GITHUB_OUTPUT
            echo "denial_suite=noble" >> $GITHUB_OUTPUT
            if [[ "$SUITE" != "noble" ]]; then
              echo "::warning::Denial 仅在 Ubuntu 24.04（noble）验证过；$SUITE 将按尽力支持使用 noble 软件源。 / Denial is only validated on Ubuntu 24.04 (noble); $SUITE uses the noble package suite as a best effort."
            fi
          else
            case "${{ inputs.version }}" in
              '13') SUITE=trixie ;;
              '14') SUITE=forky ;;
              *)
                echo "错误：不支持的 Debian 版本 ${{ inputs.version }} / Error: unsupported Debian version '${{ inputs.version }}'"
                exit 1
                ;;
            esac
            echo "suite=$SUITE" >> $GITHUB_OUTPUT
            echo "mirror=http://deb.debian.org/debian/" >> $GITHUB_OUTPUT
            echo "components=main,contrib,non-free-firmware" >> $GITHUB_OUTPUT
            echo "keyring=" >> $GITHUB_OUTPUT
            echo "denial_suite=trixie" >> $GITHUB_OUTPUT
          fi
          case "${{ inputs.desktop }}" in
            'GNOME 桌面 / GNOME Desktop') echo "desktop_slug=GNOME" >> $GITHUB_OUTPUT ;;
            'KDE 桌面 / KDE Desktop') echo "desktop_slug=KDE" >> $GITHUB_OUTPUT ;;
            'Denial 桌面 / Denial Desktop') echo "desktop_slug=Denial" >> $GITHUB_OUTPUT ;;
            '无桌面 / Headless') echo "desktop_slug=server" >> $GITHUB_OUTPUT ;;
            *) echo "desktop_slug=unknown" >> $GITHUB_OUTPUT ;;
          esac

          echo "✓ 已解析发行版：${{ inputs.distro }} $SUITE / Distribution resolved: ${{ inputs.distro }} $SUITE"

      - name: "解析分区标签 / Parse Partition Label"
        id: partition
        run: |
          if [[ "${{ inputs.quiet_boot }}" == "true" && "${{ steps.os.outputs.desktop_slug }}" != "server" ]]; then
            QUIET_BOOT=true
          else
            QUIET_BOOT=false
          fi
          echo "quiet_boot_enabled=$QUIET_BOOT" >> $GITHUB_OUTPUT

          case "${{ inputs.boot_mode }}" in
            '单系统 userdata / Single userdata')
              echo "label=userdata" >> $GITHUB_OUTPUT
              if [[ "$QUIET_BOOT" == "true" ]]; then
                echo "boot_img_pattern=boot_sheng_singleboot_plymouth.img" >> $GITHUB_OUTPUT
              else
                echo "boot_img_pattern=boot_sheng_singleboot.img" >> $GITHUB_OUTPUT
              fi
              ;;
            '双系统 linux / Dual linux')
              echo "label=linux" >> $GITHUB_OUTPUT
              if [[ "$QUIET_BOOT" == "true" ]]; then
                echo "boot_img_pattern=boot_sheng_dualboot_plymouth.img" >> $GITHUB_OUTPUT
              else
                echo "boot_img_pattern=boot_sheng_dualboot.img" >> $GITHUB_OUTPUT
              fi
              ;;
            '自定义分区 / Custom partition')
              echo "label=${{ inputs.custom_partition }}" >> $GITHUB_OUTPUT
              ;;
          esac
          echo "✓ 分区标签已确定 / Partition label set"

      # ----------------------------------------------------------------
      # Install Tools
      # ----------------------------------------------------------------

      - name: "安装构建工具 / Install Build Tools"
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap git curl
          echo "✓ 构建工具已安装 / Build tools installed"

      # ----------------------------------------------------------------
      # Acquire Kernel
      # ----------------------------------------------------------------

      - name: "下载预构建内核 / [Prebuilt] Download Kernel"
        if: ${{ inputs.kernel_source != '自行编译内核 / Build from source' }}
        run: |
          LATEST_TAG=$(gh release list --repo ianchb/sm8550-mainline --limit 1 --json tagName -q '.[0].tagName')
          echo "  最新标签：$LATEST_TAG /   Latest tag: $LATEST_TAG"

          BOOT_PATTERN="${{ steps.partition.outputs.boot_img_pattern }}"
          gh release download "$LATEST_TAG" \
            --repo ianchb/sm8550-mainline \
            --pattern "$BOOT_PATTERN" \
            --clobber
          mv "$BOOT_PATTERN" boot.img

          gh release download "$LATEST_TAG" \
            --repo ianchb/sm8550-mainline \
            --pattern "linux-xiaomi-sheng*.deb" \
            --clobber
          echo "✓ 预构建内核已下载 / Prebuilt kernel downloaded"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "下载内核安装包（自定义内核） / [Custom] Download Kernel Package"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        uses: actions/download-artifact@v8
        with:
          name: kernel-custom-deb

      - name: "下载内核镜像（自定义内核） / [Custom] Download Kernel Image"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        uses: actions/download-artifact@v8
        with:
          name: kernel-custom-image

      # ----------------------------------------------------------------
      # Download Build-Job Artifacts
      # ----------------------------------------------------------------

      - name: "下载 fastrpc / Download fastrpc"
        uses: actions/download-artifact@v8
        with:
          name: fastrpc-deb

      - name: "下载 libssc / Download libssc"
        uses: actions/download-artifact@v8
        with:
          name: libssc-deb

      - name: "下载 iio-sensor-proxy / Download iio-sensor-proxy"
        uses: actions/download-artifact@v8
        with:
          name: iio-sensor-proxy-deb

      - name: "下载 sheng-sensors / Download sheng-sensors"
        uses: actions/download-artifact@v8
        with:
          name: sheng-sensors-deb

      - name: "下载 sheng-devauth / Download sheng-devauth"
        uses: actions/download-artifact@v8
        with:
          name: sheng-devauth-deb

      # ----------------------------------------------------------------
      # Prepare Inline Packages
      # ----------------------------------------------------------------

      - name: "打包 alsa-xiaomi-sheng / Package alsa-xiaomi-sheng"
        run: |
          dpkg-deb --build --root-owner-group alsa-xiaomi-sheng
          echo "✓ alsa-xiaomi-sheng 已打包 / alsa-xiaomi-sheng.deb packaged"

      - name: "上传 alsa-xiaomi-sheng / Upload alsa-xiaomi-sheng"
        uses: actions/upload-artifact@v7
        with:
          name: alsa-xiaomi-sheng-deb
          path: alsa-xiaomi-sheng.deb
          retention-days: 3
          if-no-files-found: error

      - name: "打包 firmware-xiaomi-sheng / Package firmware-xiaomi-sheng"
        run: |
          git clone --depth 1 \
            --branch "${{ inputs.firmware_branch }}" \
            "${{ inputs.firmware_repo }}" \
            firmware-src
          mkdir -p firmware-xiaomi-sheng/usr/lib/firmware
          cp -r firmware-src/* firmware-xiaomi-sheng/usr/lib/firmware/
          rm -rf firmware-src
          dpkg-deb --build --root-owner-group firmware-xiaomi-sheng
          echo "✓ firmware-xiaomi-sheng 已打包 / firmware-xiaomi-sheng.deb packaged"

      - name: "上传 firmware-xiaomi-sheng / Upload firmware-xiaomi-sheng"
        uses: actions/upload-artifact@v7
        with:
          name: firmware-xiaomi-sheng-deb
          path: firmware-xiaomi-sheng.deb
          retention-days: 3
          if-no-files-found: error

      - name: "下载 xiaomi-mipps-auth / Download xiaomi-mipps-auth"
        run: |
          LATEST_TAG=$(gh release list --repo ianchb/xiaomi-mipps-auth --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$LATEST_TAG" \
            --repo ianchb/xiaomi-mipps-auth \
            --pattern "*.deb" \
            --clobber
          echo "✓ xiaomi-mipps-auth 已下载 / xiaomi-mipps-auth.deb downloaded"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "上传 xiaomi-mipps-auth / Upload xiaomi-mipps-auth"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-mipps-auth-deb
          path: xiaomi-mipps-auth*.deb
          retention-days: 3
          if-no-files-found: error

      - name: "下载 xiaomi-charger-mode / Download xiaomi-charger-mode"
        run: |
          LATEST_TAG=$(gh release list --repo ianchb/xiaomi-charger-mode --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$LATEST_TAG" \
            --repo ianchb/xiaomi-charger-mode \
            --pattern "*.deb" \
            --clobber
          echo "✓ xiaomi-charger-mode 已下载 / xiaomi-charger-mode.deb downloaded"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "上传 xiaomi-charger-mode / Upload xiaomi-charger-mode"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-charger-mode-deb
          path: xiaomi-charger-mode*.deb
          retention-days: 3
          if-no-files-found: error

      - name: "下载 xiaomi-sheng-thp / Download xiaomi-sheng-thp"
        run: |
          LATEST_TAG=$(gh release list --repo ianchb/xiaomi-sheng-thp --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$LATEST_TAG" \
            --repo ianchb/xiaomi-sheng-thp \
            --pattern "*.deb" \
            --clobber
          echo "✓ xiaomi-sheng-thp 已下载 / xiaomi-sheng-thp.deb downloaded"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "上传 xiaomi-sheng-thp / Upload xiaomi-sheng-thp"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-thp-deb
          path: xiaomi-sheng-thp*.deb
          retention-days: 3
          if-no-files-found: error

      - name: "下载 xiaomi-pen-status / Download xiaomi-pen-status"
        run: |
          LATEST_TAG=$(gh release list --repo ianchb/xiaomi-pen-status --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$LATEST_TAG" \
            --repo ianchb/xiaomi-pen-status \
            --pattern "*.deb" \
            --clobber
          echo "✓ xiaomi-pen-status 已下载 / xiaomi-pen-status.deb downloaded"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "上传 xiaomi-pen-status / Upload xiaomi-pen-status"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-pen-status-deb
          path: xiaomi-pen-status*.deb
          retention-days: 3
          if-no-files-found: error

      - name: "下载 xiaomi-sheng-fingerprint / Download xiaomi-sheng-fingerprint"
        run: |
          LATEST_TAG=$(gh release list --repo ianchb/xiaomi-sheng-fingerprint --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$LATEST_TAG" \
            --repo ianchb/xiaomi-sheng-fingerprint \
            --pattern "*.deb" \
            --clobber
          echo "✓ xiaomi-sheng-fingerprint 已下载 / xiaomi-sheng-fingerprint.deb downloaded"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "上传 xiaomi-sheng-fingerprint / Upload xiaomi-sheng-fingerprint"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-fingerprint-deb
          path: xiaomi-sheng-fingerprint*.deb
          retention-days: 3
          if-no-files-found: error

      - name: "适配 Ubuntu 指纹包依赖 / Relax fingerprint deps for Ubuntu"
        if: ${{ inputs.distro == 'Ubuntu' }}
        run: |
          DEB=$(ls xiaomi-sheng-fingerprint*.deb | head -n1)
          WORK=$(mktemp -d)
          dpkg-deb -R "$DEB" "$WORK"
          # 上游按 Debian 13 打包，钉死 fprintd>=1.94.5 与 libgusb2>=0.4.9；
          # Ubuntu 24.04 自带 fprintd 1.94.3 / libgusb2 0.4.8，而包里自带的私有
          # libfprint 只用 libgusb 的稳定 ABI，放宽版本下限即可正常安装。
          sed -i \
            -e 's/fprintd (>= 1\.94\.5)/fprintd/' \
            -e 's/libgusb2 (>= 0\.4\.9) | libgusb2a (>= 0\.4\.9)/libgusb2/' \
            "$WORK/DEBIAN/control"
          grep '^Depends:' "$WORK/DEBIAN/control"
          dpkg-deb --root-owner-group -b "$WORK" "$DEB" >/dev/null
          rm -rf "$WORK"
          echo "✓ 指纹包依赖已适配 Ubuntu / Fingerprint package deps relaxed for Ubuntu"

      - name: "下载 xiaomi-sheng-keyboard-helper / Download xiaomi-sheng-keyboard-helper"
        run: |
          LATEST_TAG=$(gh release list --repo ianchb/xiaomi-sheng-keyboard-helper --limit 1 --json tagName -q '.[0].tagName')
          gh release download "$LATEST_TAG" \
            --repo ianchb/xiaomi-sheng-keyboard-helper \
            --pattern "*.deb" \
            --clobber
          echo "✓ xiaomi-sheng-keyboard-helper 已下载 / xiaomi-sheng-keyboard-helper.deb downloaded"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: "上传 xiaomi-sheng-keyboard-helper / Upload xiaomi-sheng-keyboard-helper"
        uses: actions/upload-artifact@v7
        with:
          name: xiaomi-sheng-keyboard-helper.deb
          path: xiaomi-sheng-keyboard-helper*.deb
          retention-days: 3
          if-no-files-found: error

      # ----------------------------------------------------------------
      # Create Image
      # ----------------------------------------------------------------

      - name: "创建根文件系统镜像 / Create RootFS Image"
        run: |
          truncate -s "$IMAGE_SIZE" rootfs.img
          mkfs.ext4 rootfs.img
          echo "✓ 根文件系统镜像已创建（${IMAGE_SIZE}） / RootFS image created (${IMAGE_SIZE})"

      - name: "挂载根文件系统镜像 / Mount RootFS Image"
        run: |
          sudo mkdir -p "$ROOTFS_MOUNT"
          sudo mount -o loop rootfs.img "$ROOTFS_MOUNT"
          echo "✓ 根文件系统镜像已挂载到 $ROOTFS_MOUNT / RootFS image mounted at $ROOTFS_MOUNT"

      # ----------------------------------------------------------------
      # Debootstrap
      # ----------------------------------------------------------------

      - name: "运行 debootstrap（${{ inputs.distro }} ${{ steps.os.outputs.suite }}）/ Run debootstrap (${{ inputs.distro }} ${{ steps.os.outputs.suite }})"
        run: |
          SUITE="${{ steps.os.outputs.suite }}"
          KEYRING="${{ steps.os.outputs.keyring }}"
          ARGS=(--arch=arm64 --components="${{ steps.os.outputs.components }}")
          if [[ -n "$KEYRING" ]]; then
            sudo apt-get install -y ubuntu-keyring >/dev/null 2>&1 || true
            if [[ ! -e "/usr/share/debootstrap/scripts/$SUITE" ]]; then
              echo "debootstrap 缺少 $SUITE 的脚本，改用通用 Ubuntu 脚本 / debootstrap has no script for '$SUITE'; falling back to the generic Ubuntu script"
              sudo ln -sf gutsy "/usr/share/debootstrap/scripts/$SUITE"
            fi
            ARGS+=(--keyring="$KEYRING")
          fi
          sudo debootstrap "${ARGS[@]}" "$SUITE" "$ROOTFS_MOUNT" "${{ steps.os.outputs.mirror }}"
          echo "✓ debootstrap 完成 / Debootstrap complete"

      - name: "挂载虚拟文件系统 / Mount Virtual File Systems"
        run: |
          sudo mount --bind /dev "$ROOTFS_MOUNT/dev"
          sudo mount --bind /dev/pts "$ROOTFS_MOUNT/dev/pts"
          sudo mount -t proc proc "$ROOTFS_MOUNT/proc"
          sudo mount -t sysfs sys "$ROOTFS_MOUNT/sys"
          sudo cp /etc/resolv.conf "$ROOTFS_MOUNT/etc/resolv.conf"
          echo "✓ 虚拟文件系统已挂载 / Virtual file systems mounted"

      # ----------------------------------------------------------------
      # Install Packages
      # ----------------------------------------------------------------

      - name: "安装基础软件包 / Install Base Packages"
        run: |
          sudo chroot "$ROOTFS_MOUNT" apt-get update
          sudo chroot "$ROOTFS_MOUNT" apt-get install -y \
            systemd systemd-sysv \
            sudo vim wget curl \
            network-manager openssh-server \
            wpasupplicant dbus \
            ca-certificates \
            chrony \
            iw \
            lm-sensors \
            wireless-regdb \
            net-tools \
            libglib2.0-0 \
            libprotobuf-c1 \
            libqmi-glib5 \
            libmbim-glib4 \
            libyaml-0-2 \
            libgudev-1.0-0 \
            libpolkit-gobject-1-0
          # qbootctl is packaged on Debian and on Ubuntu 24.04+, but do not fail
          # the build if a release stops shipping it (A/B slot switching then has
          # to be done from a PC with fastboot or from TWRP).
          sudo chroot "$ROOTFS_MOUNT" apt-get install -y qbootctl \
            || echo "::warning::本发行版没有 qbootctl 包；镜像不会预装 A/B 槽位切换工具。 / qbootctl is unavailable in this release; no A/B slot switcher will be preinstalled."
          if [[ "${{ inputs.distro }}" == "Ubuntu" ]]; then
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y ubuntu-keyring || true
          fi
          echo "✓ 基础软件包已安装 / Base packages installed"

      - name: "启用上游无线管制数据库 / Use Upstream Regulatory Database"
        run: |
          sudo chroot "$ROOTFS_MOUNT" update-alternatives --set regulatory.db /lib/firmware/regulatory.db-upstream \
            || echo "::warning::本发行版未提供 regulatory.db-upstream 替代项，保留打包的数据库。 / regulatory.db-upstream is not provided by this release; keeping the packaged database."
          echo "✓ 已启用上游无线管制数据库 / Upstream regulatory database selected"

      - name: "安装 Plymouth / Install Plymouth"
        if: ${{ steps.partition.outputs.quiet_boot_enabled == 'true' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" apt-get update
          sudo chroot "$ROOTFS_MOUNT" apt-get install -y \
            plymouth plymouth-themes
          echo "✓ Plymouth 已安装 / Plymouth installed"

      - name: "安装设备 .deb 包 / Install All .deb Packages"
        run: |
          sudo cp ./*.deb "$ROOTFS_MOUNT/tmp/"

          echo "  待安装的软件包： /   Packages to install:"
          sudo ls -lah "$ROOTFS_MOUNT/tmp/"*.deb

          # Install one package at a time. A single unsatisfiable dependency
          # must not abort the whole batch on another distribution: for example
          # xiaomi-sheng-fingerprint needs fprintd >= 1.94.5, which Debian 13
          # ships but Ubuntu 24.04 does not, and that used to leave the kernel
          # and firmware packages uninstalled as well.
          sudo chroot "$ROOTFS_MOUNT" bash -c '
            set -u
            failed=""
            for deb in /tmp/*.deb; do
              base="$(basename "$deb")"
              if apt-get install -y "$deb" >/tmp/deb-install.log 2>&1; then
                echo "  ✓ ${base}"
              else
                failed="${failed} ${deb}"
                echo "  稍后重试 ${base}（依赖排在列表后面）/ retrying ${base} in a second pass"
              fi
            done
            if [[ -n "${failed}" ]]; then
              echo "  第二轮：重试依赖列表中前面软件包的安装 /   Second pass for packages that depend on an earlier entry"
              for deb in ${failed}; do
                base="$(basename "$deb")"
                if apt-get install -y "$deb" >/tmp/deb-install.log 2>&1; then
                  echo "  ✓ ${base}（第二轮） /   ✓ ${base} (second pass)"
                else
                  echo "::warning::${base} 在本发行版上无法安装，已跳过 / ${base} could not be installed on this release; skipping it"
                  sed -n "/^The following packages have unmet dependencies/,/^E:/p" /tmp/deb-install.log | head -8
                fi
              done
            fi
            apt-get install -f -y >/dev/null 2>&1 || true
            # 关键设备包是否真的装上（Ubuntu 上指纹包曾因版本钉死被整包跳过）
            for pkg in xiaomi-sheng-fingerprint xiaomi-pen-status xiaomi-sheng-thp; do
              if dpkg -s "$pkg" >/dev/null 2>&1; then
                echo "  ✓ ${pkg} 已安装 / installed"
              else
                echo "::warning::${pkg} 未安装 / is not installed"
              fi
            done
            rm -f /tmp/*.deb /tmp/deb-install.log
          '
          echo "✓ 设备 .deb 包已处理完成 / .deb packages processed"

      # ----------------------------------------------------------------
      # System Tuning
      # ----------------------------------------------------------------

      - name: "修正权限 / Fix Permissions"
        run: |
          if [ -f "$ROOTFS_MOUNT/usr/bin/adsprpcd" ]; then
            sudo chmod +x "$ROOTFS_MOUNT/usr/bin/adsprpcd"
            echo "✓ 已修正 adsprpcd 权限 / adsprpcd permissions fixed"
          else
            echo "  未找到 /usr/bin/adsprpcd，跳过 /   /usr/bin/adsprpcd not found, skipped"
          fi

          if [ -f "$ROOTFS_MOUNT/usr/libexec/iio-sensor-proxy" ]; then
            sudo chmod +x "$ROOTFS_MOUNT/usr/libexec/iio-sensor-proxy"
            echo "✓ 已修正 iio-sensor-proxy 权限 / iio-sensor-proxy permissions fixed"
          else
            echo "  未找到 /usr/libexec/iio-sensor-proxy，跳过 /   /usr/libexec/iio-sensor-proxy not found, skipped"
          fi

          if [ -f "$ROOTFS_MOUNT/usr/bin/monitor-sensor" ]; then
            sudo chmod +x "$ROOTFS_MOUNT/usr/bin/monitor-sensor"
            echo "✓ 已修正 monitor-sensor 权限 / monitor-sensor permissions fixed"
          else
            echo "  未找到 /usr/bin/monitor-sensor，跳过 /   /usr/bin/monitor-sensor not found, skipped"
          fi

          if [ -f "$ROOTFS_MOUNT/usr/bin/ssccli" ]; then
            sudo chmod +x "$ROOTFS_MOUNT/usr/bin/ssccli"
            echo "✓ 已修正 ssccli 权限 / ssccli permissions fixed"
          else
            echo "  未找到 /usr/bin/ssccli，跳过 /   /usr/bin/ssccli not found, skipped"
          fi

      - name: "启用传感器服务 / Enable Sensor Services"
        run: |
          if [[ -f "$ROOTFS_MOUNT/usr/lib/systemd/system/adsprpcd-sensorspd.service" ]]; then
            sudo chroot "$ROOTFS_MOUNT" systemctl enable adsprpcd-sensorspd.service
            echo "✓ 传感器服务已启用 / Sensor services enabled"
          else
            echo "::warning::缺少 adsprpcd-sensorspd.service（fastrpc 未装上），未启用传感器服务。 / adsprpcd-sensorspd.service is missing (fastrpc did not install); sensor service not enabled."
          fi

      - name: "设置主机名 / Set Hostname"
        run: |
          echo "${{ inputs.hostname }}" | sudo tee "$ROOTFS_MOUNT/etc/hostname"
          if ! grep -q "127.0.1.1.*${{ inputs.hostname }}" "$ROOTFS_MOUNT/etc/hosts"; then
            echo "127.0.1.1 ${{ inputs.hostname }}" | sudo tee -a "$ROOTFS_MOUNT/etc/hosts"
          fi
          echo "✓ 主机名已设置为 ${{ inputs.hostname }} / Hostname set to ${{ inputs.hostname }}"

      - name: "配置语言环境 / Configure Locale"
        run: |
          LANG_CHOICE="${{ inputs.language }}"

          if [ "$LANG_CHOICE" = 'None (C.UTF-8)' ]; then
            echo "✓ 系统语言保持 C.UTF-8 / System locale stays C.UTF-8"
          else
            # locales package provides locale-gen and /etc/locale.gen
            sudo chroot "$ROOTFS_MOUNT" apt-get update
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y locales
            # Generate selected language + en_US.UTF-8
            sudo sed -i 's/^# *\(en_US\.UTF-8\)/\1/' "$ROOTFS_MOUNT/etc/locale.gen"
            sudo sed -i "s/^# *\\(${LANG_CHOICE//./\\.}\\)/\\1/" "$ROOTFS_MOUNT/etc/locale.gen"
            sudo chroot "$ROOTFS_MOUNT" locale-gen
            echo "LANG=$LANG_CHOICE" | sudo tee "$ROOTFS_MOUNT/etc/default/locale"
            echo "✓ 系统语言已设置为 $LANG_CHOICE（另含 en_US.UTF-8） / Locale set to $LANG_CHOICE (+ en_US.UTF-8)"
          fi

      - name: "创建用户 / Create User"
        run: |
          sudo chroot "$ROOTFS_MOUNT" useradd \
            -m -s /bin/bash \
            -G sudo \
            "${{ inputs.username }}"
          echo "✓ 用户 ${{ inputs.username }} 已创建 / User ${{ inputs.username }} created"

      - name: "设置密码 / Set Passwords"
        env:
          INPUT_PASSWORD: ${{ inputs.password }}
          SECRET_PASSWORD: ${{ secrets.ROOTFS_PASSWORD }}
        run: |
          if [[ -n "$INPUT_PASSWORD" ]]; then
            ROOTFS_PASSWORD="$INPUT_PASSWORD"
            echo "::add-mask::$ROOTFS_PASSWORD"
          elif [[ -n "$SECRET_PASSWORD" ]]; then
            ROOTFS_PASSWORD="$SECRET_PASSWORD"
            echo "::add-mask::$ROOTFS_PASSWORD"
          else
            ROOTFS_PASSWORD="password"
            echo "::warning::未提供密码；镜像将使用默认密码 password。 / No password was provided; the image uses the default password 'password'."
          fi
          printf '%s:%s\n' "${{ inputs.username }}" "$ROOTFS_PASSWORD" | \
            sudo chroot "$ROOTFS_MOUNT" chpasswd
          printf 'root:%s\n' "$ROOTFS_PASSWORD" | \
            sudo chroot "$ROOTFS_MOUNT" chpasswd
          echo "✓ 密码已设置 / Passwords set"

      # ----------------------------------------------------------------
      # Desktop Environment
      # ----------------------------------------------------------------

      - name: "安装 GNOME 桌面 / Install GNOME"
        if: ${{ inputs.desktop == 'GNOME 桌面 / GNOME Desktop' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" apt-get update
          # Terminal and browser differ between distributions and releases:
          # Ubuntu has no firefox-esr (Firefox is a snap) and newer releases may
          # replace gnome-terminal with kgx/ptyxis, so those are best effort.
          if [[ "${{ inputs.distro }}" == "Ubuntu" ]]; then
            # Ubuntu's own minimal GNOME metapackage. It brings ubuntu-session,
            # gdm3, gnome-shell, the Ubuntu shell extensions, settings, PipeWire
            # and Xorg; --no-install-recommends skips snapd, ubuntu-report,
            # printing drivers and the browser while keeping a complete session.
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y --no-install-recommends \
              ubuntu-desktop-minimal \
              || { echo "Error: ubuntu-desktop-minimal could not be installed"; exit 1; }
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y gnome-terminal \
              || sudo chroot "$ROOTFS_MOUNT" apt-get install -y kgx \
              || echo "::warning::没有可安装的 GNOME 终端包。 / no GNOME terminal package could be installed."
            echo "::notice::Ubuntu 的 Firefox 走 snap，镜像不预装浏览器。 / Ubuntu ships Firefox as a snap; no browser is preinstalled in this image."
          else
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y \
              gnome-shell gnome-session gdm3 gnome-control-center
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y gnome-terminal \
              || sudo chroot "$ROOTFS_MOUNT" apt-get install -y kgx \
              || echo "::warning::没有可安装的 GNOME 终端包。 / no GNOME terminal package could be installed."
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y firefox-esr \
              || echo "::warning::firefox-esr 不可用；请自行安装浏览器。 / firefox-esr is unavailable; install a browser manually."
          fi
          echo "✓ GNOME 桌面已安装 / GNOME installed"

      - name: "安装 KDE 桌面 / Install KDE Plasma"
        if: ${{ inputs.desktop == 'KDE 桌面 / KDE Desktop' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" apt-get update
          if [[ "${{ inputs.plasma_mobile }}" == "true" ]]; then
            PLASMA_PACKAGE="plasma-mobile"
          else
            PLASMA_PACKAGE="plasma-desktop"
          fi
          sudo chroot "$ROOTFS_MOUNT" apt-get install -y \
            "$PLASMA_PACKAGE" plasma-workspace plasma-nm sddm pipewire-alsa \
            || echo "::warning::本发行版无法安装完整的 KDE 桌面套件；请自行安装。 / the full Plasma package set could not be installed; install the desktop manually."
          # Optional applications vary by release (Ubuntu 24.04 ships Plasma 5.27),
          # so each one is allowed to fail on its own.
          for pkg in konsole dolphin kate; do
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y "$pkg" \
              || echo "::warning::$pkg 在本发行版上不可用。 / $pkg is unavailable in this release."
          done
          if [[ "${{ inputs.distro }}" == "Debian" ]]; then
            sudo chroot "$ROOTFS_MOUNT" apt-get install -y firefox-esr \
              || echo "::warning::firefox-esr 不可用；请自行安装浏览器。 / firefox-esr is unavailable; install a browser manually."
          else
            echo "::notice::Ubuntu 的 Firefox 走 snap，镜像不预装浏览器。 / Ubuntu ships Firefox as a snap; no browser is preinstalled in this image."
          fi
          echo "✓ KDE 桌面已安装 / KDE Plasma installed"

      - name: "配置 KDE 的 Plymouth 主题 / Install KDE Plasma Plymouth Settings"
        if: ${{ inputs.desktop == 'KDE 桌面 / KDE Desktop' && steps.partition.outputs.quiet_boot_enabled == 'true' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" apt-get update
          sudo chroot "$ROOTFS_MOUNT" apt-get install -y \
            kde-config-plymouth plymouth-theme-breeze \
            || echo "::warning::本发行版没有 KDE 的 Plymouth 主题。 / the KDE Plymouth theme is unavailable in this release."
          echo "✓ KDE 的 Plymouth 主题已配置 / KDE Plasma Plymouth settings installed"

      # ----------------------------------------------------------------
      # Denial (Wayland compositor + Flutter shell)
      # ----------------------------------------------------------------

      - name: "安装 Denial 桌面 / Install Denial"
        if: ${{ inputs.desktop == 'Denial 桌面 / Denial Desktop' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" bash -c '
            set -euo pipefail
            install -d -m 0755 /etc/apt/keyrings
            curl -fsSL https://packages.denialwm.org/denial-repo-key.asc \
              -o /etc/apt/keyrings/denial.asc
            chmod 0644 /etc/apt/keyrings/denial.asc
            echo "deb [signed-by=/etc/apt/keyrings/denial.asc] https://packages.denialwm.org/apt ${{ steps.os.outputs.denial_suite }} main" \
              > /etc/apt/sources.list.d/denial.list
            apt-get update
            apt-get install -y denial
          '
          echo "✓ Denial 桌面已安装 / Denial installed"

      - name: "配置 Denial 会话 / Configure Denial Session"
        if: ${{ inputs.desktop == 'Denial 桌面 / Denial Desktop' }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" apt-get install -y sddm
          sudo chroot "$ROOTFS_MOUNT" usermod -aG video,render,input,audio,plugdev \
            "${{ inputs.username }}"
          if [[ "${{ inputs.autologin }}" == "true" ]]; then
            sudo mkdir -p "$ROOTFS_MOUNT/etc/sddm.conf.d"
            printf '[Autologin]\nUser=%s\nSession=denial\n' "${{ inputs.username }}" | \
              sudo tee "$ROOTFS_MOUNT/etc/sddm.conf.d/10-denial.conf" >/dev/null
          fi
          sudo chroot "$ROOTFS_MOUNT" systemctl enable sddm
          sudo chroot "$ROOTFS_MOUNT" systemctl set-default graphical.target
          echo "✓ Denial 会话已配置（SDDM，Session=denial） / Denial session configured (SDDM, Session=denial)"

      - name: "配置 GDM / Configure GDM"
        if: ${{ inputs.desktop == 'GNOME 桌面 / GNOME Desktop' && (!inputs.autologin) }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" systemctl enable gdm3
          sudo chroot "$ROOTFS_MOUNT" systemctl set-default graphical.target
          echo "✓ GDM 已启用（手动登录） / GDM enabled (manual login)"

      - name: "配置 SDDM / Configure SDDM"
        if: ${{ inputs.desktop == 'KDE 桌面 / KDE Desktop' && (!inputs.autologin) }}
        run: |
          sudo chroot "$ROOTFS_MOUNT" systemctl enable sddm
          sudo chroot "$ROOTFS_MOUNT" systemctl set-default graphical.target
          echo "✓ SDDM 已启用（手动登录） / SDDM enabled (manual login)"

      - name: "配置 GDM 自动登录 / Configure GDM with Autologin"
        if: ${{ inputs.desktop == 'GNOME 桌面 / GNOME Desktop' && inputs.autologin }}
        run: |
          # Debian gdm3 reads /etc/gdm3/daemon.conf, Ubuntu reads custom.conf.
          # Without the right file autologin is silently ignored.
          if [[ "${{ inputs.distro }}" == "Ubuntu" ]]; then
            GDM_CONF="$ROOTFS_MOUNT/etc/gdm3/custom.conf"
            SESSION_NAME="ubuntu"
          else
            GDM_CONF="$ROOTFS_MOUNT/etc/gdm3/daemon.conf"
            SESSION_NAME="gnome"
          fi
          sudo mkdir -p "$ROOTFS_MOUNT/etc/gdm3"
          sudo tee "$GDM_CONF" << EOF
          [daemon]
          AutomaticLoginEnable=true
          AutomaticLogin=${{ inputs.username }}
          EOF
          # Pin the session GDM starts for the autologin user, so the greeter
          # does not depend on which session files happen to be installed.
          sudo mkdir -p "$ROOTFS_MOUNT/var/lib/AccountsService/users"
          sudo tee "$ROOTFS_MOUNT/var/lib/AccountsService/users/${{ inputs.username }}" << EOF
          [User]
          XSession=$SESSION_NAME
          SystemAccount=false
          EOF
          sudo chroot "$ROOTFS_MOUNT" systemctl enable gdm3
          sudo chroot "$ROOTFS_MOUNT" systemctl set-default graphical.target
          echo "✓ 已为 ${{ inputs.username }} 配置 GDM 自动登录（会话 $SESSION_NAME） / GDM autologin configured for ${{ inputs.username }} ($SESSION_NAME)"

      - name: "配置 SDDM 自动登录 / Configure SDDM with Autologin"
        if: ${{ inputs.desktop == 'KDE 桌面 / KDE Desktop' && inputs.autologin }}
        run: |
          if [[ "${{ inputs.plasma_mobile }}" == "true" ]]; then
            SDDM_SESSION="plasma-mobile"
          else
            SDDM_SESSION="plasma"
          fi
          sudo mkdir -p "$ROOTFS_MOUNT/etc/sddm.conf.d"
          sudo tee "$ROOTFS_MOUNT/etc/sddm.conf.d/autologin.conf" << EOF
          [Autologin]
          User=${{ inputs.username }}
          Session=$SDDM_SESSION
          EOF
          sudo chroot "$ROOTFS_MOUNT" systemctl enable sddm
          sudo chroot "$ROOTFS_MOUNT" systemctl set-default graphical.target
          echo "✓ 已为 ${{ inputs.username }} 配置 SDDM 自动登录 / SDDM autologin configured for ${{ inputs.username }}"

      - name: "启用 NetworkManager / Enable NetworkManager"
        run: |
          sudo chroot "$ROOTFS_MOUNT" systemctl enable NetworkManager
          echo "✓ NetworkManager 已启用 / NetworkManager enabled"

      # ----------------------------------------------------------------
      # Finalize & Unmount
      # ----------------------------------------------------------------

      - name: "配置 fstab / Configure fstab"
        run: |
          PARTITION="${{ steps.partition.outputs.label }}"
          echo "PARTLABEL=$PARTITION / ext4 defaults,x-systemd.growfs 0 1" | \
            sudo tee "$ROOTFS_MOUNT/etc/fstab"
          echo "PARTLABEL=persist /mnt/sheng-persist ext4 ro,noload,nosuid,nodev,noexec,nofail,x-systemd.device-timeout=10s 0 0" | \
            sudo tee -a "$ROOTFS_MOUNT/etc/fstab"
          echo "✓ fstab 已配置：root=PARTLABEL=$PARTITION / fstab configured: root=PARTLABEL=$PARTITION"

      - name: "配置 Wi-Fi MAC 地址 / Configure WLAN MAC"
        run: |
          sudo mkdir -p "$ROOTFS_MOUNT/mnt/sheng-persist" \
            "$ROOTFS_MOUNT/usr/lib/firmware/ath12k/WCN7850/hw2.0"
          sudo ln -s /mnt/sheng-persist/kiwi_v2/wlan_mac.bin \
            "$ROOTFS_MOUNT/usr/lib/firmware/ath12k/WCN7850/hw2.0/wlan_mac.bin"
          sudo install -D -m 0644 patches/sheng-wlan.conf \
            "$ROOTFS_MOUNT/etc/modprobe.d/sheng-wlan.conf"
          sudo install -D -m 0644 patches/sheng-wlan.service \
            "$ROOTFS_MOUNT/usr/lib/systemd/system/sheng-wlan.service"
          sudo chroot "$ROOTFS_MOUNT" systemctl enable sheng-wlan.service
          echo "✓ Wi-Fi MAC 地址已配置 / WLAN MAC configured"

      - name: "清理 APT 缓存 / Clean APT Cache"
        run: |
          sudo chroot "$ROOTFS_MOUNT" apt-get clean
          sudo rm -f "$ROOTFS_MOUNT/etc/resolv.conf"
          echo "✓ APT 缓存已清理 / APT cache cleaned"

      - name: "卸载虚拟文件系统 / Unmount Virtual File Systems"
        if: always()
        run: |
          sudo umount "$ROOTFS_MOUNT/dev/pts" 2>/dev/null || true
          sudo umount "$ROOTFS_MOUNT/dev" 2>/dev/null || true
          sudo umount "$ROOTFS_MOUNT/proc" 2>/dev/null || true
          sudo umount "$ROOTFS_MOUNT/sys" 2>/dev/null || true
          echo "✓ 虚拟文件系统已卸载 / Virtual file systems unmounted"

      - name: "卸载镜像并写入 UUID / Unmount Image & Set UUID"
        run: |
          sudo umount "$ROOTFS_MOUNT" 2>/dev/null || true
          tune2fs -U ee8d3593-59b1-480e-a3b6-4fefb17ee7d8 rootfs.img || true
          echo "✓ 镜像已卸载并写入 UUID / Image unmounted, UUID set"

      # ----------------------------------------------------------------
      # Boot Image (custom kernel only)
      # ----------------------------------------------------------------

      - name: "生成 boot.img（自定义内核） / [Custom] Generate boot.img"
        if: ${{ inputs.kernel_source == '自行编译内核 / Build from source' }}
        run: |
          PARTITION="${{ steps.partition.outputs.label }}"
          CMDLINE="root=PARTLABEL=$PARTITION"
          if [[ "${{ steps.partition.outputs.quiet_boot_enabled }}" == "true" ]]; then
            CMDLINE="$CMDLINE quiet splash plymouth.ignore-serial-consoles fbcon=map:1"
          fi
          chmod +x mkbootimg
          ./mkbootimg \
            --kernel Image.gz-dtb_sheng \
            --cmdline "$CMDLINE" \
            --base 0x00000000 \
            --kernel_offset 0x00008000 \
            --tags_offset 0x01e00000 \
            --pagesize 4096 \
            --id \
            -o boot.img
          echo "✓ boot.img 已生成（cmdline: $CMDLINE） / boot.img generated (cmdline: $CMDLINE)"

      # ----------------------------------------------------------------
      # Upload Final Artifacts
      # ----------------------------------------------------------------

      - name: "上传根文件系统镜像 / Upload RootFS Image"
        uses: actions/upload-artifact@v7
        with:
          name: rootfs-${{ steps.os.outputs.suite }}-${{ steps.os.outputs.desktop_slug }}-${{ steps.partition.outputs.label }}
          path: rootfs.img
          retention-days: 14
          if-no-files-found: error
          compression-level: 1

      - name: "上传启动镜像 / Upload Boot Image"
        uses: actions/upload-artifact@v7
        with:
          name: boot-${{ steps.os.outputs.suite }}-${{ steps.os.outputs.desktop_slug }}-${{ steps.partition.outputs.label }}
          path: boot.img
          retention-days: 14
          if-no-files-found: warn
          compression-level: 1
